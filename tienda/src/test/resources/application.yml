spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

jwt:
  secret: clave-super-secreta-para-pruebas-unitarias-con-512bits-12345678901234567890
  expiration: 86400000

logging:
  level:
    com.empresa.tienda: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
